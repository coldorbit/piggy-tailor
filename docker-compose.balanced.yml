x-resume-tailor-app: &resume-tailor-app
  image: ${IMAGE:-resume-tailor:local}
  build: .
  expose:
    - "5000"
  environment:
    - FLASK_ENV=${FLASK_ENV:-production}
    - OPENAI_TIMEOUT_SECONDS=${OPENAI_TIMEOUT_SECONDS:-150}
    - DATABASE_URL=${DATABASE_URL}
    - DATABASE_SSL=${DATABASE_SSL:-false}
    - MIGRATE_PROFILES_FROM_YAML=${MIGRATE_PROFILES_FROM_YAML:-true}
    - RESUME_S3_BUCKET=${RESUME_S3_BUCKET:-}
    - AWS_REGION=${AWS_REGION:-us-east-1}
    - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
    - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
    - PORT=5000
  command: gunicorn --bind 0.0.0.0:5000 --timeout ${GUNICORN_TIMEOUT:-180} --log-level ${LOG_LEVEL:-info} --access-logfile - --error-logfile - --capture-output app:app
  restart: unless-stopped

services:
  resume-tailor-key-1:
    <<: *resume-tailor-app
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY_1:?Set OPENAI_API_KEY_1 in .env}
      - OPENAI_TIMEOUT_SECONDS=${OPENAI_TIMEOUT_SECONDS:-150}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_SSL=${DATABASE_SSL:-false}
      - MIGRATE_PROFILES_FROM_YAML=${MIGRATE_PROFILES_FROM_YAML:-true}
      - RESUME_S3_BUCKET=${RESUME_S3_BUCKET:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - PORT=5000

  resume-tailor-key-2:
    <<: *resume-tailor-app
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY_2:?Set OPENAI_API_KEY_2 in .env}
      - OPENAI_TIMEOUT_SECONDS=${OPENAI_TIMEOUT_SECONDS:-150}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_SSL=${DATABASE_SSL:-false}
      - MIGRATE_PROFILES_FROM_YAML=${MIGRATE_PROFILES_FROM_YAML:-true}
      - RESUME_S3_BUCKET=${RESUME_S3_BUCKET:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - PORT=5000

  resume-tailor-lb:
    image: nginx:1.27-alpine
    depends_on:
      - resume-tailor-key-1
      - resume-tailor-key-2
    ports:
      - "${HOST_PORT:-5000}:5000"
    volumes:
      - ./nginx-load-balancer.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
