    - label: Programming Languages
      details: Python, SQL, Java, Scala, R, Shell, TypeScript, Go
    - label: Data Platforms
      details: Snowflake, BigQuery, Redshift, Databricks, PostgreSQL, MySQL, SQL Server,
        MongoDB
    - label: Frameworks
      details: dbt, Apache Spark, Pandas, Scikit-learn, TensorFlow, PySpark, Flask,
        FastAPI
    - label: Orchestration / ETL
      details: Apache Airflow, Prefect, Luigi, Kafka, NiFi, Stitch, Talend, SSIS
    - label: Cloud Services
      details: AWS, GCP, Azure, S3, Lambda, GCS, Cloud Functions, EKS
    - label: DevOps & Infrastructure
      details: Terraform, Kubernetes, Docker, Git, CI/CD, Jenkins, GitLab, Helm
    - label: Observability & Testing
      details: Prometheus, Grafana, Datadog, Sentry, Great Expectations, pytest, ELK
        Stack, NewRelic
    - label: Data Modeling & MLOps
      details: Kimball, Data Vault, Star Schema, Feature Stores, MLflow, TFX, Parquet,
        Avro
    - label: Security & Governance
      details: HIPAA, GDPR, Data Catalogs, AWS KMS, IAM, Lake Formation, Collibra,
        Apache Ranger
